# Publishes sites/lynn-seal to GitHub Pages (lynnsealnaples.com).
# Runs on every push to main that touches the site, or by hand from the Actions tab.
name: Deploy Lynn Seal site

on:
  push:
    branches: [main]
    paths: ["sites/lynn-seal/**", ".github/workflows/lynn-seal-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lynn-seal-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build pages from data and templates
        working-directory: sites/lynn-seal
        run: node build.js
      - name: Assemble the public folder
        run: |
          mkdir -p dist
          rsync -a sites/lynn-seal/ dist/ \
            --exclude dist-preview --exclude screenshots --exclude templates --exclude tools \
            --exclude data --exclude build.js --exclude '*.md' --exclude '.gitignore'
          echo "lynnsealnaples.com" > dist/CNAME
          touch dist/.nojekyll
          du -sh dist && find dist -maxdepth 2 -type d | sort
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
