<form class="lead" data-lead data-endpoint="{{site.formEndpoint}}" data-log="{{site.leadLogEndpoint}}" id="{{formId}}" action="https://formsubmit.co/{{agent.email}}" method="POST" novalidate>
  <input type="hidden" name="_subject" value="{{subject}}">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="source" value="{{source}}">
  <input type="hidden" name="listing" value="{{listingRef}}">
  <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="f2">
    <label>First name<input name="first_name" autocomplete="given-name" required data-req></label>
    <label>Last name<input name="last_name" autocomplete="family-name" required data-req></label>
  </div>
  <div class="f2">
    <label>Email<input type="email" name="email" autocomplete="email" required data-req></label>
    <label>Phone<input type="tel" name="phone" autocomplete="tel" placeholder="Optional"></label>
  </div>
  {{{extraFields}}}
  <label>Message<textarea name="message" placeholder="{{placeholder}}"></textarea></label>
  <div class="form-foot">
    <p class="fine">Goes only to Lynn. Never sold or shared.</p>
    <button class="btn primary" type="submit">{{buttonLabel}}</button>
  </div>
  <div class="status" hidden role="status" aria-live="polite"></div>
</form>
